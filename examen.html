<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen</title>
</head>
<style>
    .contenido{
        display: grid;
        grid-template-columns: 1fr 3fr 1fr;
    }

    .logo{
        display: flex;
    }

    .noticiero{
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(2, 1fr);
    }

    .ultimas-noticias{
        display: grid;
        grid-template-columns: repeat(2, 1fr);
    }


    .fecha{
        display: grid;
        grid-template-columns: repeat(2, 1fr);
    }

    .fecha-larga{
        grid-row: 1;
        grid-column: span 2;
    }

    .arriba{
        display: grid;
        grid-template-columns: 1fr 3fr 1fr;
        background-color: lightblue;
    }

    .categorias{
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        padding: 10px;
        background-color: lightgoldenrodyellow;
    }  
</style>

    <div class = "arriba">

        </div>
        <div class = "noticiero">

        </div>

            </div>

    </div>
    
    <div class = "categorias">

</body>
</html>
